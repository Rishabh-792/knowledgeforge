name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The README advertises 3.11+; test every version it claims.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app ingestion scripts tests evaluation

      - name: Test (local mode, no cloud credentials)
        run: pytest -q --cov=app --cov=ingestion --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # Retrieval quality over a golden question set. Runs in local mode, so the
  # numbers describe the deterministic offline embedder and extractive LLM -
  # no cloud account, no key, no network.
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run retrieval evaluation
        run: python -m evaluation.run_eval

      - name: Enforce retrieval quality floors
        run: |
          python - <<'PY'
          import json, sys

          summary = json.load(open("evaluation/results.json"))["summary"]
          print(json.dumps(summary, indent=2))

          # Floors sit below the committed results so ordinary variation does
          # not fail the build, but a real regression in chunking, embedding,
          # or ranking does.
          floors = {"hit@5": 0.70, "hit@3": 0.65, "mrr": 0.55, "ndcg@5": 0.58}
          failures = [
              f"{k}={summary[k]:.4f} < floor {v}"
              for k, v in floors.items()
              if summary[k] < v
          ]
          if failures:
              sys.exit("Retrieval quality gate failed:\n  " + "\n  ".join(failures))
          print("Retrieval quality gate passed.")
          PY

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results.json
          retention-days: 14

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Terraform validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The default docker driver cannot export a GHA cache; the container
      # driver can, and still supports load: true for the smoke test below.
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: knowledgeforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name kf -p 8000:8000 knowledgeforge:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz; then
              echo "healthz OK"; exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"; docker logs kf; exit 1
