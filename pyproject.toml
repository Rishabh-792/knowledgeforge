[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "SIM905", # a split() word-list stays more readable than a 40-element literal
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts calls in argument defaults on purpose.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "app.core.security.require_role",
]

[tool.ruff.lint.per-file-ignores]
# These entry points adjust sys.path before importing the app package.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"evaluation/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
